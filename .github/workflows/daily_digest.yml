name: Canvas daily digest

on:
  schedule:
    # GitHub cron is UTC. 11:37 UTC = 6:37 AM US Eastern (standard) / 7:37 AM (daylight). Off the top of the hour to avoid GitHub dropping/delaying runs under load.
    # Adjust for your timezone. GitHub may start scheduled runs 5-30 min late.
    - cron: "37 11 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send digest
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '7' }}
          ANNOUNCEMENT_LOOKBACK_HOURS: ${{ vars.ANNOUNCEMENT_LOOKBACK_HOURS || '24' }}
        run: python tools/run_daily_digest.py
